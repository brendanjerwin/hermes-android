name: Release Debug APK

# Publishes the UNSIGNED debug APK as a GitHub Release when a debug tag is
# pushed ( Obtainium-friendly: tracks the repo's releases; installable on any
# device with "install unknown apps" enabled — debug builds are signed with
# the auto-generated debug key, which is stable per-workflow-runner only on
# OUR fork's pinned runner cache — for real keystore stability, graduate to
# release.yml + its keystore secrets).
#
# Tag shape: vd<X.Y>[ -beta.Z]  (vd0.1.1, vd0.2.0-beta.1) — the 'd' = debug;
# avoids colliding with the upstream's v* signing-based release tags.

on:
  push:
    tags: ["vd*"]

permissions:
  contents: write

jobs:
  release-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - run: chmod +x ./gradlew

      - name: Build unsigned debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Hermes-debug-${GITHUB_REF_NAME}.apk
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Hermes-debug-${{ github.ref_name }}.apk
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          generate_release_notes: true
